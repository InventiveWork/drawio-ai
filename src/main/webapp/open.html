<!DOCTYPE html>
<html>
<head>
    <title>Open Diagram</title>
    <link rel="stylesheet" type="text/css" href="styles/grapheditor.css" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<script src="js/open.js" type="text/javascript"></script>
</head>
<body>
<form method="POST" enctype="multipart/form-data" action="" name="openForm"
	id="openForm" accept-charset="UTF-8">
    		<!-- Somewhere in your index.html, likely within the main application container or as a floating panel -->
<div id="aiChatboxContainer" style="position: fixed; bottom: 20px; right: 20px; width: 300px; height: 400px; background-color: #f0f0f0; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column;">
    <div id="aiChatboxHeader" style="background-color: #ddd; padding: 10px; font-weight: bold; cursor: move;">AI Chat</div>
    <div id="aiChatboxMessages" style="flex-grow: 1; padding: 10px; overflow-y: auto; background-color: #fff;">
        <!-- Messages will appear here -->
    </div>
    <div id="aiChatboxInputArea" style="padding: 10px; border-top: 1px solid #ccc;">
        <input type="text" id="aiChatInput" style="width: calc(100% - 60px); padding: 5px;" placeholder="Ask AI to modify diagram...">
        <button id="aiChatSendButton" style="width: 50px; padding: 5px;">Send</button>
    </div>
</div>
<table style="width:100%;">
<tr>
<td style="height:40px;vertical-align:top;" colspan="2">
<input type="file" name="upfile">
</td>
</tr>
<tr>
<td colspan="2" height="120px" id="openSupported" style="font-family:arial;color:grey;font-size:9pt;vertical-align:top;text-align:left;">
</td>
</tr>
<tr>
<td>
</td>
<td style="vertical-align:middle;text-align:right;white-space:nowrap;">
<input type="button" id="closeButton" class="geBtn" value="Cancel">
<input type="submit" id="openButton" class="geBtn gePrimaryBtn" value="Open" disabled="disabled">
</td>
</tr>
</table>
</form>
</body>
</html>
